<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#3a3a44;font-family:monospace;color:#ddd}
  .wrap{display:flex;flex-wrap:wrap;gap:26px;padding:24px;align-items:flex-start}
  canvas{image-rendering:pixelated;background:#23232b;border:1px solid #555}
  h3{margin:4px 0;font-size:12px}
  .col{display:flex;flex-direction:column;gap:6px}
</style></head>
<body>
  <div class="wrap" id="wrap"></div>
<script>
const PAL = {
  '.':null,
  'K':'#241019',  // dark outline
  'h':'#e0a93a','g':'#a9761f','y':'#ffe07a',          // hair
  's':'#f1c39a','S':'#d2986e','i':'#ffd9b4',          // skin
  'e':'#33263a','W':'#f4f4ff','m':'#a85c46',          // eyes/mouth
  't':'#e6dfce','u':'#b3a988','w':'#f7f2e6',          // tunic
  'b':'#6e4a2c','n':'#e0b545',                        // belt/buckle/gold
  'p':'#5d4636','q':'#3f3026','o':'#3a2a1e',          // pants/boots
  'L':'#dfe3ec','l':'#a7aebb',                        // silver hair
  'V':'#6f63b0','v':'#4c4080',                        // robe
  'd':'#7a4d24','c':'#5a3415','G':'#e7b53e',          // chest wood/gold
};

const HERO = [
"........................",
"........KKKKKKKK........",
"......KhhhhhhhhhhK......",
".....KhhhhhhhhhhhhK.....",
".....KyyyhhhhhhhhhK.....",
"....KyyyhhhhhhhhhhgK....",
"....KghhhhhhhhhhhhgK....",
"....KghsssssssssshgK....",
"....KghssWessWesshgK....",
"....KghssssSSsssshgK....",
".....KsssssmmsssssK.....",
".....KSssssssssssSK.....",
"......KSssssssssSK......",
".......KSssssssSK.......",
".........KSssSK.........",
".....KwtttttttttuuK.....",
"....KsSwtttttttuuSsK....",
"....KsSwtttttttuuSsK....",
"....KSSbbbbnnbbbbSSK....",
".....KwttttttttttuK.....",
".....KpppppqqpppppK.....",
"......KppppqqppppK......",
"......KppppqqppppK......",
"......KppppKKppppK......",
"......KooooKKooooK......",
"......KooooKKooooK......",
"........................",
];

const COMPANION = [
"....................",
".......KKKKKK.......",
".....KKLLLLLLKK.....",
"....KLLLLLLLLLLK....",
"....KLlLLLLLLllK....",
"....KlLssssssLlK....",
"....KlLsessesLlK....",
"....KlLssssssLlK....",
"....KlLssmmssLlK....",
"....KlSssssssSlK....",
".....KsssssssK......",
"....KVVVVVVVVVVK....",
"...KVvVVVVVVVVvVK...",
"...KVvVVVVVVVVvVK...",
"...KVvVVVVVVVVvVK...",
"...KVvVVVVVVVVvVK...",
"...KvvVVVVVVVVvvK...",
"...KvVVVVVVVVVVvK...",
"....KvoooooooovK....",
"....Koooo..ooooK....",
"....................",
"....................",
];

const CHEST = [
"......................",
"....KKKKKKKKKKKKKK....",
"...KddddddddddddddK...",
"...KdGGGGGGGGGGGGdK...",
"...KddddddddddddddK...",
"..KddddddddddddddddK..",
"..KdGGGGGGnnGGGGGGdK..",
"..KdGGGGGGnnGGGGGGdK..",
"..KddddddddddddddddK..",
"..KccddddddddddddccK..",
"..KccccccccccccccccK..",
"...KKKKKKKKKKKKKKKK...",
"......................",
"......................",
];

function render(canvas, sprite, scale, grid){
  const w = sprite[0].length, h = sprite.length;
  canvas.width = w*scale; canvas.height = h*scale;
  const c = canvas.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<sprite[y].length;x++){
    const col = PAL[sprite[y][x]];
    if(col){ c.fillStyle=col; c.fillRect(x*scale,y*scale,scale,scale); }
  }
  if(grid){
    c.strokeStyle='rgba(255,255,255,.1)';
    for(let x=0;x<=w;x++){c.beginPath();c.moveTo(x*scale,0);c.lineTo(x*scale,h*scale);c.stroke();}
    for(let y=0;y<=h;y++){c.beginPath();c.moveTo(0,y*scale);c.lineTo(w*scale,y*scale);c.stroke();}
    c.strokeStyle='rgba(120,200,255,.45)';
    for(let x=0;x<=w;x+=4){c.beginPath();c.moveTo(x*scale,0);c.lineTo(x*scale,h*scale);c.stroke();}
    for(let y=0;y<=h;y+=4){c.beginPath();c.moveTo(0,y*scale);c.lineTo(w*scale,y*scale);c.stroke();}
    c.fillStyle='#8cf'; c.font='9px monospace';
    for(let x=0;x<w;x+=2) c.fillText(x, x*scale+1, 9);
    for(let y=0;y<h;y+=2) c.fillText(y, 1, y*scale+10);
  }
}

const wrap = document.getElementById('wrap');
[['HERO',HERO],['COMPANION',COMPANION],['CHEST',CHEST]].forEach(([name,sp])=>{
  const col = document.createElement('div'); col.className='col';
  col.innerHTML = '<h3>'+name+'</h3>';
  const a=document.createElement('canvas'), b=document.createElement('canvas'), s=document.createElement('canvas');
  col.append(a,b,s); wrap.append(col);
  render(a,sp,14,false); render(b,sp,14,true); render(s,sp,5,false);
});
</script>
</body></html>
